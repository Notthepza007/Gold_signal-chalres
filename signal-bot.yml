name: Signal Bot

on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "daily / daily_status / test / gold / pa / backtest"
        default: "daily_status"

permissions:
  contents: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_MODE: ${{ github.event.inputs.run_mode || 'daily' }}
        run: python signals.py

      - name: Save state
        if: ${{ github.event.inputs.run_mode == '' || github.event.inputs.run_mode == 'daily' }}
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update state" && git push)
